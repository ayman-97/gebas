services:
  - type: web
    name: gebas-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: DATABASE_URL
        fromDatabase:
          name: gebas-db
          property: connectionString

databases:
  - name: gebas-db
    databaseName: gebas
    user: gebas_user
    plan: free
